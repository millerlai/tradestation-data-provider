[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tradestation-data-provider"
version = "0.1.0"
description = "TradeStation EasyLanguage → Parquet data ingestion / verification / imputation pipeline"
requires-python = ">=3.11"
readme = "README.md"
authors = [{ name = "Miller Lai" }]

dependencies = [
    "pyzmq>=26.0",
    "polars>=1.0",
    "pyarrow>=16.0",
    "pyyaml>=6.0",
    "structlog>=24.0",
    # Windows Python stdlib ships without IANA tz data; polars needs it
    # when reading TIMESTAMPTZ columns from DuckDB / Arrow.
    "tzdata>=2024.1 ; sys_platform == 'win32'",
    "duckdb>=1.5.2",
    "pydantic>=2.13.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.10",
]

[project.scripts]
tradestation-data-ingest = "tradestation_data.runtime.main:main"

[tool.hatch.build.targets.wheel]
packages = ["src/tradestation_data"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]
filterwarnings = [
    "error",
    "ignore::DeprecationWarning",
]

[tool.coverage.run]
source = ["src/tradestation_data"]
branch = true
omit = [
    "tests/*",
    "*/__main__.py",
]

[tool.coverage.report]
show_missing = true
skip_covered = false
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.:",
    "^\\s*\\.\\.\\.\\s*$",
]

[tool.coverage.html]
directory = "htmlcov"

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]
extend-exclude = [
    # Vendored vcpkg / build helpers — third-party Python scripts that
    # ship next to the C++ build system. Not part of this project.
    "cpp/build-tools",
    "cpp/vcpkg_installed",
]

[tool.ruff.lint]
select = [
    "E", "F", "W",      # pycodestyle + pyflakes
    "I",                 # isort
    "N",                 # pep8-naming
    "UP",                # pyupgrade
    "B",                 # bugbear
    "SIM",               # simplify
    "RUF",               # ruff-specific
]
ignore = [
    "E501",              # line length (handled by formatter)
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["N802", "N803"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unreachable = true
files = ["src"]
