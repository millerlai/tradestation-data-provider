name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel superseded runs on the same branch when a new push happens.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    # The Python binding is one subdirectory of this repo; the repo root
    # holds the wire contract, the EL indicator, and the C++ bridge.
    defaults:
      run:
        working-directory: bindings/python
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: false  # cpp/build-tools/vcpkg isn't needed for Python CI

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          # Resolved against the checkout root, *not* the job-level
          # working-directory (same reason upload-artifact spells out the full
          # path below). A bare `pyproject.toml` matches nothing since the
          # Python package moved, which silently drops the dependency hash from
          # the cache key — so a Dependabot bump to uv.lock would keep restoring
          # the pre-bump environment forever.
          cache-dependency-glob: |
            bindings/python/pyproject.toml
            bindings/python/uv.lock

      - name: Set up Python ${{ matrix.python }}
        run: uv python install ${{ matrix.python }}

      - name: Sync dev deps
        run: uv sync --extra dev --python ${{ matrix.python }}

      - name: Lint (ruff check)
        run: uv run ruff check .

      - name: Format check (ruff format)
        run: uv run ruff format --check .

      - name: Lint the contract tools (ruff, repo-root config)
        # The two steps above never reach contract/ — their working-directory
        # is bindings/python. contract/tools/record.py is the neutral fixture
        # recorder every binding is checked against; it earns that role by
        # depending on no binding, not by escaping lint. --project keeps the
        # binding's environment while leaving the working directory at the
        # repo root, so ruff resolves the root .ruff.toml.
        working-directory: .
        run: |
          uv run --project bindings/python ruff check contract
          uv run --project bindings/python ruff format --check contract

      - name: Type check (mypy)
        # mypy is configured strict on src/ in pyproject.toml; a regression
        # here fails CI rather than being noticed at release time.
        run: uv run mypy

      - name: Tests (pytest)
        run: uv run pytest -q

  build:
    name: Build wheel + sdist
    runs-on: ubuntu-latest
    needs: test
    defaults:
      run:
        working-directory: bindings/python
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: false

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          # Resolved against the checkout root, *not* the job-level
          # working-directory (same reason upload-artifact spells out the full
          # path below). A bare `pyproject.toml` matches nothing since the
          # Python package moved, which silently drops the dependency hash from
          # the cache key — so a Dependabot bump to uv.lock would keep restoring
          # the pre-bump environment forever.
          cache-dependency-glob: |
            bindings/python/pyproject.toml
            bindings/python/uv.lock

      - name: Set up Python 3.12
        run: uv python install 3.12

      - name: Build
        run: uv build

      - name: Smoke-test the wheel in an isolated venv
        # Confirms the wheel is installable as a dependency and exposes
        # what we claim it does — same check the release workflow runs
        # before publishing.
        run: |
          uv run --isolated --no-project --with dist/*.whl \
            python -c "import tradestation_data; from tradestation_data.sinks import SinkPipeline; print('import OK')"
          uv run --isolated --no-project --with dist/*.whl \
            tradestation-data-ingest --help > /dev/null
          echo "entrypoint OK"

      - name: Upload dist as artifact
        uses: actions/upload-artifact@v7
        with:
          name: dist-${{ github.sha }}
          # Not a `run:` step, so job-level working-directory does not apply.
          path: bindings/python/dist/
          retention-days: 7
